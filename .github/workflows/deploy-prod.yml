name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (optional)"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: false
        default: "prod"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Set web build id
        run: echo "NEXT_PUBLIC_WEB_BUILD_ID=web_${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Lint (optional)
        run: pnpm -r lint

      - name: Typecheck (optional)
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Build release bundle
        run: |
          mkdir -p release
          cp package.json pnpm-workspace.yaml pnpm-lock.yaml release/
          mkdir -p release/apps/api release/apps/worker release/apps/web release/packages/shared
          cp -r apps/api/dist release/apps/api/dist
          cp apps/api/package.json release/apps/api/package.json
          cp -r apps/worker/dist release/apps/worker/dist
          cp apps/worker/package.json release/apps/worker/package.json
          cp -r apps/web/.next release/apps/web/.next
          cp -r apps/web/public release/apps/web/public
          cp apps/web/package.json release/apps/web/package.json
          if ls apps/web/next.config.* 1> /dev/null 2>&1; then cp apps/web/next.config.* release/apps/web/; fi
          cp -r packages/shared/dist release/packages/shared/dist
          cp packages/shared/package.json release/packages/shared/package.json
          cp -r prisma release/prisma
          cp ecosystem.config.cjs release/ecosystem.config.cjs
          cp scripts/deploy_remote.sh release/deploy_remote.sh
          tar -czf release.tgz -C release .

      - name: Add SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -P "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes release.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/release.tgz"

      - name: Remote deploy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" << 'SSH'
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          tar -xzf /tmp/release.tgz -C "$TMP_DIR"
          bash "$TMP_DIR/deploy_remote.sh" /tmp/release.tgz "${DEPLOY_PATH}"
          rm -rf "$TMP_DIR"
          SSH

      - name: Post-deploy check
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PROD_API_BASE_URL }}" ]; then
            echo "PROD_API_BASE_URL is missing; skipping post-deploy check"
            exit 0
          fi
          curl -fsS "${{ secrets.PROD_API_BASE_URL }}/health" | head -c 2000
          curl -fsS "${{ secrets.PROD_API_BASE_URL }}/meta/version" | head -c 2000
